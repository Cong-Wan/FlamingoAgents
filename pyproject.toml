[project]
name = "flamingo-agents"
version = "0.1.0"
description = "Local Flamingo Agents as a pure library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flamingoAgents"]
