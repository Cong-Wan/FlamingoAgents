[project]
name = "flamingo-agents"
version = "0.1.0"
description = "Local Flamingo Agents with CLI and HTTP entrypoints"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
flamingo-agents = "flamingoAgents.app.cli:main"
flamingo-agents-server = "flamingoAgents.app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flamingoAgents"]
