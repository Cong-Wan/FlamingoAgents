providers: # 模型提供商列表
  "glm": # 智谱 GLM Coding Plan（OpenAI 协议端点，到 /v4 为止，代码会自动拼 /chat/completions）
    baseUrl: https://open.bigmodel.cn/api/coding/paas/v4
    api: openai-completions # 代码当前仅支持此协议
    apiKey: your-api-key-here # 替换为你自己的 API 密钥
    models:
      - id: glm-5.2 # 原样传给 API
        name: GLM-5.2 智谱编程套餐
        input:
          - text
          - image
        contextWindow: 1048576 # 1M tokens（用户确认）
        maxTokens: 65536 # 官方 GLM-5.2 示例值
        reasoning: true
        thinking: # thinking 控制（OpenAI 协议下原样注入请求体）
          type: enabled # enabled=动态深度思考 / disabled=关闭
        reasoningEffort: max # 最高推理档：max > xhigh > high > medium > low > minimal
        cost: # 编程套餐为订阅制，按 token 计价填 0
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
  "101": # 提供商 ID（此处以局域网 IP 简写命名）
    baseUrl: http://192.168.0.101:8080/v1 # API 端点地址
    api: openai-completions # API 协议类型（OpenAI Chat Completions，兼容性最广）
    apiKey: llama.cpp # API 密钥（本地服务会忽略，这里仅作占位）
    models: # 该提供商下的模型列表
      - id: Qwen3.6-27B-MTP-IQ4_KS # 模型标识（会原样传给 API）
        name: Qwen3.6 27B MTP IQ4_KS - LAN # 可读名称，用于模型匹配和详情展示
        input: # 支持的输入类型
          - text # 纯文本（可选 image 表示支持图片）
        contextWindow: 98304 # 上下文窗口大小（单位：token）
        maxTokens: 65536 # 最大输出 token 数
        reasoning: true # 是否为支持扩展思考（推理）的模型
        cost: # 成本配置（按每百万 token 计价，单位：美元）
          input: 0 # 输入 token 成本
          output: 0 # 输出 token 成本
          cacheRead: 0 # 缓存读取成本
          cacheWrite: 0 # 缓存写入成本
