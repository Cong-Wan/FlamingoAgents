version: 2

enabledTools:
  - read
  - write
  - edit
  - bash

toolPermissions:
  bash:
    - id: deletionCommand
      field: command
      action: requireApproval
      reason: 删除命令需要用户确认
      match:
        type: regex
        patterns:
          - '(^|[;&|]\s*)rm\s+(-[A-Za-z]*\s+)*[^\n;&|]+'
          - '(^|[;&|]\s*)rmdir\s+[^\n;&|]+'
          - '(^|[;&|]\s*)unlink\s+[^\n;&|]+'
          - '(^|[;&|]\s*)find\s+[^\n;&|]*\s-delete(\s|$)'
          - 'os\.(remove|unlink|rmdir)\s*\('
          - 'shutil\.rmtree\s*\('
          - 'pathlib\.[A-Za-z0-9_\.]+\.(unlink|rmdir)\s*\('
